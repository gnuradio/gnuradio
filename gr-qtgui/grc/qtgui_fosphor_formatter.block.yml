id: qtgui_rfnoc_f15_formatter
label: QT GUI RFNoC F15 Formatter
flags: [ python, ]

parameters:
-   id: type
    label: IO Type
    dtype: enum
    options: [complex, float, int, short]
    option_attributes:
        fcn: [cc, ff, ii, ss]
    hide: part
-   id: num_inputs
    label: Num Inputs
    dtype: int
    default: '2'
    hide: part
-   id: vlen
    label: Vector Length
    dtype: int
    default: '1'
    hide: ${ 'part' if vlen == 1 else 'none' }

inputs:
-   domain: stream
    dtype: ${ type }
    vlen: ${ vlen }
    multiplicity: ${ num_inputs }

outputs:
-   domain: stream
    dtype: ${ type }
    vlen: ${ vlen }

asserts:
- ${ num_inputs > 1 }
- ${ vlen > 0 }

templates:
    imports: from gnuradio import qtgui
    make: qtgui.rfnoc_f15_formatter(${vlen})

file_format: 1

