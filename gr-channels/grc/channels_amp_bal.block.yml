id: channels_amp_bal
label: Amplitude Balance

parameters:
-   id: alpha
    label: Alpha
    dtype: float
    default: '1e-4'

inputs:
-   domain: stream
    dtype: complex

outputs:
-   domain: stream
    dtype: complex

templates:
    imports: from gnuradio import channels
    make: channels.amp_bal(${alpha})
    callbacks:
    - set_alpha(${alpha})

documentation: |-
    Scales Q to the RMS level of I. Alpha in (0, 1] is the RMS averaging
    coefficient.

file_format: 1
