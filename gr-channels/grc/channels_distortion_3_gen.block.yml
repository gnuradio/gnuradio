id: channels_distortion_3_gen
label: Third Order Distortion

parameters:
-   id: beta
    label: Distortion
    dtype: float
    default: '0'

inputs:
-   domain: stream
    dtype: complex

outputs:
-   domain: stream
    dtype: complex

templates:
    imports: from gnuradio import channels
    make: channels.distortion_3_gen(${beta})
    callbacks:
    - set_beta(${beta})

documentation: |-
    Third order distortion: y = x + beta |x|^2 x. A real beta models AM/AM
    compression or expansion only.

file_format: 1
