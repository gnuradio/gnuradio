id: channels_phase_noise_gen
label: Phase Noise Generator

parameters:
-   id: noise_mag
    label: Noise Magnitude
    dtype: float
    default: '0'
-   id: alpha
    label: Alpha
    dtype: float
    default: '0.1'
-   id: seed
    label: Seed
    dtype: int
    default: '0'
    hide: part

inputs:
-   domain: stream
    dtype: complex

outputs:
-   domain: stream
    dtype: complex

templates:
    imports: from gnuradio import channels
    make: channels.phase_noise_gen(${noise_mag}, ${alpha}, ${seed})
    callbacks:
    - set_noise_mag(${noise_mag})
    - set_alpha(${alpha})

documentation: |-
    Phase noise as a single-pole IIR lowpass filtered Gaussian. Noise
    Magnitude is the standard deviation of the Gaussian input; the phase
    standard deviation is noise_mag * sqrt(alpha / (2 - alpha)). Instances with
    the same seed generate the same phase noise.

file_format: 1
